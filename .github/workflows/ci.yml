name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'snapshots/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    # Only the trailing release step needs to write, but permissions are set
    # per job, so this job carries it for every branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install CocoaPods dependencies
        run: |
          rm -f Podfile.lock
          rm -rf Pods
          pod install

      - name: Run unit tests
        run: sh unit-tests.sh

      # On master the packaging step compiles the app itself, so building here
      # would compile the same configuration twice.
      - name: Build app
        if: github.ref != 'refs/heads/master'
        run: sh build.sh

      - name: Build installer package
        if: github.ref == 'refs/heads/master'
        run: PKG_POSTINSTALL_ACTION=logout bash package/build-package.bash

      - name: Create GitHub release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG="$(ls -t /tmp/hallelujah-*.pkg | head -n 1)"
          SHA="$(git rev-parse --short HEAD)"
          TAG="build-${SHA}"
          TITLE="Automated build $(date '+%Y-%m-%d %H:%M') (${SHA})"

          # Commit subjects since the previous release tag (excluding this
          # commit's own tag, so workflow re-runs don't produce an empty range)
          RANGE="HEAD"
          for t in $(git tag --sort=-creatordate); do
            if [ "$t" != "$TAG" ]; then RANGE="${t}..HEAD"; break; fi
          done
          CHANGELOG="$(git log --pretty=format:'%s' "$RANGE" | head -n 30)"

          NOTES="Automated release built from commit ${SHA}."
          if [ -n "$CHANGELOG" ]; then
            NOTES="$(printf '%s\n\n%s' "$NOTES" "$CHANGELOG")"
          fi

          # Replace any existing release for this commit (e.g. on workflow re-run)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" "$PKG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease
